<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>DTDC Cold Chain Report — Professional Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sawasdee:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #0F3A7D;
  --primary-light: #1565C0;
  --primary-dark: #0D2B5F;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --dark: #1F2937;
  --light: #F9FAFB;
  --border: #E5E7EB;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

body.dark-mode {
  --primary: #1E40AF;
  --primary-light: #3B82F6;
  --text-primary: #F3F4F6;
  --text-secondary: #D1D5DB;
  --dark: #111827;
  --light: #1F2937;
  --border: #374151;
}

html, body {
  height: 100%;
}

body {
  font-family: 'Sawasdee', 'Poppins', sans-serif;
  background: linear-gradient(135deg, #F9FAFB 0%, #F3F4F6 100%);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 12px;
  font-size: 16px;
  transition: background-color 0.3s, color 0.3s;
}

body.dark-mode {
  background: linear-gradient(135deg, #111827 0%, #1F2937 100%);
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border-radius: 16px;
  padding: 20px 16px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-xl);
  position: relative;
  overflow: hidden;
  flex-wrap: wrap;
  gap: 12px;
}

.header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -10%;
  width: 300px;
  height: 300px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  filter: blur(40px);
}

.header-content {
  position: relative;
  z-index: 1;
}

.header h1 {
  color: #fff;
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.header p {
  color: rgba(255, 255, 255, 0.9);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 1;
  flex-wrap: wrap;
}

.date-display {
  text-align: right;
  color: #fff;
}

.date-display .date {
  font-size: 20px;
  font-weight: 800;
  font-family: 'Times New Roman', serif;
  display: block;
  margin-bottom: 2px;
}

.date-display .time {
  font-size: 11px;
  opacity: 0.9;
}

.theme-toggle {
  background: rgba(255, 255, 255, 0.2);
  border: 2px solid rgba(255, 255, 255, 0.4);
  color: #fff;
  padding: 8px 14px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}

.theme-toggle:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  background: #fff;
  border-radius: 12px;
  padding: 8px;
  box-shadow: var(--shadow-md);
  flex-wrap: wrap;
  overflow-x: auto;
}

body.dark-mode .tabs {
  background: var(--dark);
}

.tab-btn {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  color: var(--text-secondary);
  transition: all 0.3s ease;
  position: relative;
  white-space: nowrap;
}

.tab-btn:hover {
  background: rgba(15, 58, 125, 0.05);
  color: var(--primary);
}

.tab-btn.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  box-shadow: var(--shadow-md);
}

.tab-content {
  display: none;
  animation: fadeIn 0.3s ease;
}

.tab-content.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Toolbar */
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow-md);
  flex-wrap: wrap;
}

body.dark-mode .toolbar {
  background: var(--dark);
}

.filters {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  flex: 1;
}

.filter-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.filter-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

select, input[type="date"], input[type="number"], input[type="text"], input[type="search"] {
  background: var(--light);
  border: 2px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  padding: 8px 12px;
  font-size: 13px;
  min-width: 140px;
  transition: all 0.3s ease;
  font-family: 'Poppins', sans-serif;
}

body.dark-mode select,
body.dark-mode input {
  background: #374151;
  border-color: #4B5563;
  color: var(--text-primary);
}

select:focus, input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 58, 125, 0.1);
}

.action-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Poppins', sans-serif;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  box-shadow: var(--shadow-md);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.btn-secondary {
  background: var(--light);
  color: var(--text-primary);
  border: 2px solid var(--border);
}

.btn-secondary:hover {
  background: var(--border);
  border-color: var(--primary);
}

/* KPI Cards */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.kpi {
  border-radius: 12px;
  padding: 16px;
  background: #fff;
  box-shadow: var(--shadow-md);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

body.dark-mode .kpi {
  background: var(--dark);
}

.kpi::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
}

.kpi:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}

.kpi-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 32px;
  font-weight: 800;
  font-family: 'Times New Roman', serif;
  line-height: 1;
  color: var(--primary);
  margin-bottom: 6px;
}

.kpi-sub {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
}

/* Alert Box */
.alert-box {
  background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  color: #fff;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}

.alert-box::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -10%;
  width: 250px;
  height: 250px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  filter: blur(40px);
}

.alert-content {
  position: relative;
  z-index: 1;
}

.alert-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
  opacity: 0.95;
}

.alert-plate {
  font-size: 28px;
  font-weight: 800;
  font-family: 'Times New Roman', serif;
  margin-bottom: 6px;
}

.alert-temp {
  font-size: 48px;
  font-weight: 900;
  font-family: 'Times New Roman', serif;
  line-height: 1;
}

/* Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.card {
  border-radius: 12px;
  padding: 16px;
  background: #fff;
  border-left: 6px solid;
  box-shadow: var(--shadow-md);
  transition: all 0.3s ease;
  position: relative;
}

body.dark-mode .card {
  background: var(--dark);
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.card-fail { border-left-color: #EF4444; }
.card-warn { border-left-color: #F59E0B; }
.card-pass { border-left-color: #10B981; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.plate {
  font-size: 20px;
  font-weight: 800;
  font-family: 'Times New Roman', serif;
  color: var(--primary);
}

.badge {
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-fail { background: rgba(239, 68, 68, 0.15); color: #DC2626; }
.badge-warn { background: rgba(245, 158, 11, 0.15); color: #D97706; }
.badge-pass { background: rgba(16, 185, 129, 0.15); color: #059669; }

.temp-display {
  font-size: 44px;
  font-weight: 900;
  font-family: 'Times New Roman', serif;
  line-height: 1;
  margin-bottom: 10px;
}

.temp-fail { color: #EF4444; }
.temp-warn { color: #F59E0B; }
.temp-pass { color: #10B981; }

.card-meta {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

.card-date {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

/* Chart Container */
.chart-container {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
  position: relative;
  height: 350px;
}

body.dark-mode .chart-container {
  background: var(--dark);
}

.chart-title {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 14px;
  color: var(--text-primary);
}

/* Table */
.table-container {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
  overflow-x: auto;
}

body.dark-mode .table-container {
  background: var(--dark);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th {
  background: linear-gradient(135deg, rgba(15, 58, 125, 0.1) 0%, rgba(21, 101, 192, 0.1) 100%);
  padding: 10px;
  text-align: left;
  font-weight: 700;
  color: var(--primary);
  border-bottom: 2px solid var(--border);
}

td {
  padding: 10px;
  border-bottom: 1px solid var(--border);
}

tr:hover {
  background: rgba(15, 58, 125, 0.05);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  font-size: 14px;
  font-weight: 600;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
  border-radius: 12px;
  color: #059669;
  border: 2px dashed #10B981;
}

/* Responsive */
@media (max-width: 768px) {
  body { padding: 8px; }
  .header { padding: 16px 12px; gap: 8px; }
  .header h1 { font-size: 20px; }
  .header-right { gap: 8px; }
  .date-display .date { font-size: 18px; }
  .toolbar { padding: 12px; gap: 10px; }
  .filters { gap: 10px; }
  .filter-group { width: 100%; }
  select, input { width: 100%; min-width: unset; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi { padding: 12px; }
  .kpi-value { font-size: 24px; }
  .cards-grid { grid-template-columns: 1fr; gap: 10px; }
  .chart-container { height: 280px; }
  .tabs { gap: 6px; padding: 6px; }
  .tab-btn { padding: 8px 12px; font-size: 11px; }
  .btn { padding: 8px 10px; font-size: 11px; }
  table { font-size: 11px; }
  th, td { padding: 8px; }
}
</style>
</head>
<body>

<div class="header">

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMVZpLDw93Dgc316KlyZwXiLhaQ8z6h6cOX8Xrnjs9bXJClFqywussefttmal0jbbpJtMyzOPw0W4h/pub?gid=0&single=true&output=csv';

let allData = [];
let headers = [];
let COL = {};
let trendChart = null;

// Tab switching logic
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tabName = btn.dataset.tab;
    if (tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      
      if (tabName === 'dashboard') renderDashboard();
      if (tabName === 'daily') renderDailyReport();
      if (tabName === 'summary') renderSummaryReport();
    }
  });
});

// Event Listeners for Filters
document.getElementById('filter-date').addEventListener('change', renderDailyReport);
document.getElementById('filter-company').addEventListener('change', renderDailyReport);
document.getElementById('filter-product').addEventListener('change', renderDailyReport);
document.getElementById('filter-status').addEventListener('change', renderDailyReport);
document.getElementById('summary-range').addEventListener('change', renderSummaryReport);

// Dark Mode logic
document.getElementById('theme-toggle').addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
  document.getElementById('theme-toggle').textContent = document.body.classList.contains('dark-mode') ? '☀️ Light' : '🌙 Dark';
  if(trendChart) trendChart.update();
});

if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark-mode');
  document.getElementById('theme-toggle').textContent = '☀️ Light';
}

function detectColumns(headers) {
  headers.forEach((h, i) => {
    const name = h.trim();
    if (name.includes('วันที่')) COL.date = i;
    if (name.includes('ทะเบียนรถ')) COL.plate = i;
    if (name.includes('ชื่อบริษัทรถ') || name.includes('ชื่อบริษัท')) COL.company = i;
    if (name.includes('อุณหภูมิ')) COL.temp = i;
    if (name.includes('ผลอุณหภูมิ') || name.includes('สถานะ')) COL.tempResult = i;
    if (name.includes('สินค้า')) COL.product = i;
  });
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const result = [];

  for (let i = 0; i < lines.length; i++) {
    const row = [];
    let current = '';
    let inQuotes = false;

    for (let c = 0; c < lines[i].length; c++) {
      const char = lines[i][c];
      if (char === '"') {
        inQuotes = !inQuotes;
      }
      else if (char === ',' && !inQuotes) {
        row.push(current.trim());
        current = '';
      }
      else {
        current += char;
      }
    }
    row.push(current.trim());
    result.push(row);
  }
  return result;
}

function getTodayString() {
  const now = new Date();
  const d = String(now.getDate()).padStart(2, '0');
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const y = now.getFullYear();
  return `${y}-${m}-${d}`;
}

function matchDate(dataDateStr, filterDateStr) {
  if (!dataDateStr || !filterDateStr) return false;
  const parts = dataDateStr.split('/');
  if (parts.length === 3) {
    let d = parts[0].padStart(2, '0');
    let m = parts[1].padStart(2, '0');
    let y = parseInt(parts[2]);
    if (y > 2500) y -= 543;
    const formattedDataDate = `${y}-${m}-${d}`;
    return formattedDataDate === filterDateStr;
  }
  return dataDateStr.includes(filterDateStr);
}

function getTempColor(temp, result) {
  const t = parseFloat(temp);
  if (isNaN(t)) return 'pass';
  if (result && result.includes('ไม่ผ่าน')) return 'fail';
  if (result && result.includes('แจ้งเตือน')) return 'warn';
  if (t > 5) return 'fail';
  if (t > 4) return 'warn';
  return 'pass';
}

function buildCard(row) {
  const plate = row[COL.plate] || '-';
  const company = row[COL.company] || '-';
  const temp = row[COL.temp] || '-';
  const product = row[COL.product] || '-';
  const date = row[COL.date] || '-';
  const status = getTempColor(temp, row[COL.tempResult]);
  const tempNum = parseFloat(temp);

  const badgeText = status === 'fail' ? '❌ ไม่ผ่าน' : status === 'warn' ? '⚠️ แจ้งเตือน' : '✅ ผ่าน';

  return `
    <div class="card card-${status}">
      <div class="card-top">
        <div class="plate">${plate}</div>
        <div class="badge badge-${status}">${badgeText}</div>
      </div>
      <div class="temp-display temp-${status}">
        ${isNaN(tempNum) ? '-' : tempNum.toFixed(1)}°C
      </div>
      <div class="card-meta">
        🏢 ${company}<br>
        📦 ${product}
      </div>
      <div class="card-date">
        📅 ${date}
      </div>
    </div>
  `;
}

function getCompanyStats(data) {
  const stats = {};
  data.forEach(row => {
    const company = row[COL.company] || 'ไม่ระบุ';
    if (!stats[company]) {
      stats[company] = { total: 0, pass: 0, fail: 0, warn: 0, temps: [] };
    }
    const status = getTempColor(row[COL.temp], row[COL.tempResult]);
    const temp = parseFloat(row[COL.temp]);

    stats[company].total++;
    stats[company][status]++;
    if (!isNaN(temp)) stats[company].temps.push(temp);
  });
  return stats;
}

function calculateCompanyScore(stats) {
  const scores = {};
  Object.entries(stats).forEach(([company, data]) => {
    const passRate = (data.pass / data.total) * 100;
    const avgTemp = data.temps.length ? (data.temps.reduce((a, b) => a + b, 0) / data.temps.length) : 0;
    const tempScore = Math.max(0, 100 - (avgTemp * 10));
    scores[company] = {
      passRate,
      tempScore,
      total: (passRate * 0.6 + tempScore * 0.4),
      stats: data
    };
  });
  return scores;
}

function renderDashboard() {
  if (allData.length === 0) return;

  const stats = getCompanyStats(allData);
  const scores = calculateCompanyScore(stats);

  const totalRuns = allData.length;
  const passRuns = allData.filter(r => getTempColor(r[COL.temp], r[COL.tempResult]) === 'pass').length;
  const failRuns = allData.filter(r => getTempColor(r[COL.temp], r[COL.tempResult]) === 'fail').length;
  const warnRuns = allData.filter(r => getTempColor(r[COL.temp], r[COL.tempResult]) === 'warn').length;

  const temps = allData.map(r => parseFloat(r[COL.temp])).filter(t => !isNaN(t));
  const avgTemp = temps.length ? (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1) : '-';
  const maxTemp = temps.length ? Math.max(...temps).toFixed(1) : '-';
  const minTemp = temps.length ? Math.min(...temps).toFixed(1) : '-';

  const topCompany = Object.entries(scores).sort((a, b) => b[1].total - a[1].total)[0];

  let html = `
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">📊 รวมทั้งหมด</div>
        <div class="kpi-value">${totalRuns}</div>
        <div class="kpi-sub">ครั้ง</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">✅ ผ่าน</div>
        <div class="kpi-value">${passRuns}</div>
        <div class="kpi-sub">${totalRuns > 0 ? ((passRuns/totalRuns)*100).toFixed(1) : 0}%</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">⚠️ แจ้งเตือน</div>
        <div class="kpi-value">${warnRuns}</div>
        <div class="kpi-sub">${totalRuns > 0 ? ((warnRuns/totalRuns)*100).toFixed(1) : 0}%</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">❌ ไม่ผ่าน</div>
        <div class="kpi-value">${failRuns}</div>
        <div class="kpi-sub">${totalRuns > 0 ? ((failRuns/totalRuns)*100).toFixed(1) : 0}%</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">🌡️ เฉลี่ย</div>
        <div class="kpi-value">${avgTemp}</div>
        <div class="kpi-sub">°C</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">📈 สูงสุด</div>
        <div class="kpi-value">${maxTemp}</div>
        <div class="kpi-sub">°C</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">📉 ต่ำสุด</div>
        <div class="kpi-value">${minTemp}</div>
        <div class="kpi-sub">°C</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">🏆 บริษัทดีที่สุด</div>
        <div class="kpi-value" style="font-size: 20px;">${topCompany ? topCompany[0].substring(0, 8) : '-'}</div>
        <div class="kpi-sub">${topCompany ? topCompany[1].passRate.toFixed(1) : 0}%</div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-title">📈 แนวโน้มอุณหภูมิตัวเลขจริง 30 รายการล่าสุด</div>
      <canvas id="tempChart"></canvas>
    </div>
  `;

  document.getElementById('dashboard-content').innerHTML = html;
  renderTempChart();
}

function renderTempChart() {
  const ctx = document.getElementById('tempChart');
  if (!ctx) return;
  
  const recentData = allData.slice(-30).filter(r => !isNaN(parseFloat(r[COL.temp])));
  const labels = recentData.map(r => r[COL.date] + ' (' + r[COL.plate] + ')');
  const tempValues = recentData.map(r => parseFloat(r[COL.temp]));

  if (trendChart) {
    trendChart.destroy();
  }

  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'อุณหภูมิจริง (°C)',
        data: tempValues,
        borderColor: '#0F3A7D',
        backgroundColor: 'rgba(15, 58, 125, 0.1)',
        borderWidth: 2,
        tension: 0.3,
        fill: true,
        pointBackgroundColor: tempValues.map(t => t > 5 ? '#EF4444' : t > 4 ? '#F59E0B' : '#10B981')
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: {
          beginAtZero: false,
          title: { display: true, text: 'อุณหภูมิ (°C)', color: 'var(--text-secondary)' },
          ticks: { color: 'var(--text-secondary)' }
        },
        x: {
          ticks: { color: 'var(--text-secondary)', maxTicksLimit: 10 }
        }
      }
    }
  });
}

function renderDailyReport() {
  const filterDate = document.getElementById('filter-date').value;
  const filterCompany = document.getElementById('filter-company').value;
  const filterProduct = document.getElementById('filter-product').value;
  const filterStatus = document.getElementById('filter-status').value;

  let filtered = allData.filter(row => {
    if (!row[COL.plate]) return false;
    if (filterDate && !matchDate(row[COL.date], filterDate)) return false;
    if (filterCompany && row[COL.company] !== filterCompany) return false;
    if (filterProduct && !(row[COL.product] || '').includes(filterProduct)) return false;

    const status = getTempColor(row[COL.temp], row[COL.tempResult]);
    if (filterStatus && status !== filterStatus) return false;

    return true;
  });

  const problems = filtered.filter(r => {
    const s = getTempColor(r[COL.temp], r[COL.tempResult]);
    return s === 'fail' || s === 'warn';
  });

  const passed = filtered.filter(r => getTempColor(r[COL.temp], r[COL.tempResult]) === 'pass');

  const totalCount = filtered.length;
  const passCount = passed.length;
  const failCount = problems.length;

  const temps = filtered.map(r => parseFloat(r[COL.temp])).filter(t => !isNaN(t));

  const avgTemp = temps.length ? (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1) : '-';
  const maxTemp = temps.length ? Math.max(...temps).toFixed(1) : '-';
  const minTemp = temps.length ? Math.min(...temps).toFixed(1) : '-';

  document.getElementById('display-date').textContent = filterDate || getTodayString();
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString('th-TH');

  let html = `
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">📊 รถที่ตรวจ</div><div class="kpi-value">${totalCount}</div></div>
      <div class="kpi"><div class="kpi-label">✅ ผ่าน</div><div class="kpi-value">${passCount}</div><div class="kpi-sub">${totalCount > 0 ? ((passCount/totalCount)*100).toFixed(1) : 0}%</div></div>
      <div class="kpi"><div class="kpi-label">⚠️ ปัญหา</div><div class="kpi-value">${failCount}</div><div class="kpi-sub">${totalCount > 0 ? ((failCount/totalCount)*100).toFixed(1) : 0}%</div></div>
      <div class="kpi"><div class="kpi-label">🌡️ เฉลี่ย</div><div class="kpi-value">${avgTemp}</div><div class="kpi-sub">°C</div></div>
      <div class="kpi"><div class="kpi-label">📈 สูงสุด</div><div class="kpi-value">${maxTemp}</div><div class="kpi-sub">°C</div></div>
      <div class="kpi"><div class="kpi-label">📉 ต่ำสุด</div><div class="kpi-value">${minTemp}</div><div class="kpi-sub">°C</div></div>
    </div>
  `;

  const worstTruck = filtered
    .filter(r => getTempColor(r[COL.temp], r[COL.tempResult]) === 'fail')
    .sort((a, b) => parseFloat(b[COL.temp]) - parseFloat(a[COL.temp]))[0];

  if (worstTruck) {
    html += `
    <div class="alert-box">
      <div class="alert-content">
        <div class="alert-title">⚠️ ตรวจพบปัญหาอุณหภูมิสูงผิดปกติ</div>
        <div class="alert-plate">รถทะเบียน: ${worstTruck[COL.plate] || '-'}</div>
        <div class="alert-temp">${parseFloat(worstTruck[COL.temp]).toFixed(1)}°C</div>
        <div style="margin-top: 8px; font-size: 12px; opacity: 0.9;">
          บริษัท: ${worstTruck[COL.company] || '-'} | สินค้า: ${worstTruck[COL.product] || '-'}
        </div>
      </div>
    </div>`;
  }

  html += `<div class="cards-grid">`;
  
  if (filtered.length > 0) {
    filtered.forEach(row => {
      html += buildCard(row);
    });
  } else {
    html += `
      <div class="empty-state" style="grid-column: 1 / -1;">
        ไม่มีข้อมูลการตรวจสอบในเงื่อนไขที่เลือก
      </div>`;
  }
  
  html += `</div>`;
  document.getElementById('daily-content').innerHTML = html;
}

function renderSummaryReport() {
  const range = document.getElementById('summary-range').value;
  let groupedData = {};
  let dateFormat = '';

  allData.forEach(row => {
    const dateStr = row[COL.date];
    if (!dateStr) return;

    const parts = dateStr.split('/');
    if (parts.length !== 3) return;

    let d = parseInt(parts[0]);
    let m = parseInt(parts[1]);
    let y = parseInt(parts[2]);
    if (y > 2500) y = y - 543;

    let key = '';
    if (range === 'day') {
      key = dateStr;
      dateFormat = 'วันที่';
    } else if (range === 'week') {
      const date = new Date(y, m - 1, d);
      const weekStart = new Date(date);
      weekStart.setDate(date.getDate() - date.getDay());
      key = `สัปดาห์ ${weekStart.toLocaleDateString('th-TH')}`;
      dateFormat = 'สัปดาห์';
    } else if (range === 'month') {
      key = `${m}/${y}`;
      dateFormat = 'เดือน';
    }

    if (!groupedData[key]) {
      groupedData[key] = { total: 0, pass: 0, fail: 0, warn: 0, temps: [] };
    }

    const status = getTempColor(row[COL.temp], row[COL.tempResult]);
    const temp = parseFloat(row[COL.temp]);

    groupedData[key].total++;
    groupedData[key][status]++;
    if (!isNaN(temp)) groupedData[key].temps.push(temp);
  });

  let html = `<div class="table-container">
    <table>
      <thead>
        <tr>
          <th>${dateFormat}</th>
          <th>รวม</th>
          <th>ผ่าน</th>
          <th>แจ้งเตือน</th>
          <th>ไม่ผ่าน</th>
          <th>อัตราผ่าน (%)</th>
          <th>อุณหภูมิเฉลี่ย</th>
        </tr>
      </thead>
      <tbody>`;

  Object.keys(groupedData).sort().forEach(key => {
    const data = groupedData[key];
    const passRate = ((data.pass / data.total) * 100).toFixed(1);
    const avgTemp = data.temps.length ? (data.temps.reduce((a, b) => a + b, 0) / data.temps.length).toFixed(1) : '-';

    html += `
      <tr>
        <td><strong>${key}</strong></td>
        <td>${data.total}</td>
        <td>✅ ${data.pass}</td>
        <td>⚠️ ${data.warn}</td>
        <td>❌ ${data.fail}</td>
        <td><strong style="color: ${passRate >= 80 ? '#10B981' : passRate >= 60 ? '#F59E0B' : '#EF4444'}">${passRate}%</strong></td>
        <td>${avgTemp}°C</td>
      </tr>
    `;
  });

  html += `</tbody></table></div>`;
  document.getElementById('summary-content').innerHTML = html;
}

// System Initialization
async function initApp() {
  try {
    const response = await fetch(CSV_URL);
    if (!response.ok) throw new Error('Network response was not ok');
    const csvText = await response.text();
    
    const parsed = parseCSV(csvText);
    if (parsed.length > 0) {
      headers = parsed[0];
      detectColumns(headers);
      allData = parsed.slice(1).filter(row => row.length > 1 && row[COL.date]); // Filter out empty rows

      // Populate Company Dropdown
      const companies = [...new Set(allData.map(r => r[COL.company]).filter(Boolean))].sort();
      const companySelect = document.getElementById('filter-company');
      companies.forEach(company => {
        const option = document.createElement('option');
        option.value = company;
        option.textContent = company;
        companySelect.appendChild(option);
      });

      // Update date UI
      document.getElementById('display-date').textContent = getTodayString();
      document.getElementById('filter-date').value = getTodayString();
      document.getElementById('last-update').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleTimeString('th-TH');

      // Render default tab
      renderDashboard();
    } else {
      document.getElementById('dashboard-content').innerHTML = `<div class="empty-state">ไม่พบข้อมูลในระบบ</div>`;
    }
  } catch (error) {
    console.error('Error fetching data:', error);
    document.getElementById('dashboard-content').innerHTML = `
      <div class="alert-box">
        <div class="alert-title">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล</div>
        <p style="font-size: 14px;">โปรดตรวจสอบลิงก์ Google Sheet ว่าได้เปิดเป็น "เผยแพร่ทางเว็บ" (Publish to web) เป็นแบบ CSV แล้วหรือไม่</p>
      </div>`;
  }
}

// Start App
window.onload = initApp;
</script>
