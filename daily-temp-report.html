<!DOCTYPE html>

<style>

* {

</style>

<body>

<script>

const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMVZpLDw93Dgc316KlyZwXiLhaQ8z6h6cOX8Xrnjs9bXJClFqywussefttmal0jbbpJtMyzOPw0W4h/pub?gid=0&single=true&output=csv';

let allData = [];
let headers = [];
let COL = {};
let tempChart = null;
let trendChart = null;

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'trend') renderTrendAnalysis();
  });
});

// Dark Mode
document.getElementById('theme-toggle').addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
  updateChartTheme();
});

if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark-mode');
  document.getElementById('theme-toggle').textContent = '☀️ Light Mode';
}

function detectColumns(headers) {
  headers.forEach((h, i) => {
    const name = h.trim();
    if (name.includes('วันที่ตรวจ')) COL.date = i;
    if (name.includes('ทะเบียนรถ')) COL.plate = i;
    if (name.includes('ชื่อบริษัทรถ') || name.includes('ชื่อบริษัท')) COL.company = i;
    if (name.includes('อุณหภูมิก่อนโหลดสินค้า')) COL.temp = i;
    if (name.includes('ผลอุณหภูมิก่อนโหลด')) COL.tempResult = i;
    if (name.includes('สินค้าที่โหลด')) COL.product = i;
  });
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const result = [];

  for (let i = 0; i < lines.length; i++) {
    const row = [];
    let current = '';
    let inQuotes = false;

    for (let c = 0; c < lines[i].length; c++) {
      const char = lines[i][c];
      if (char === '"') {
        inQuotes = !inQuotes;
      }
      else if (char === ',' && !inQuotes) {
        row.push(current.trim());
        current = '';
      }
      else {
        current += char;
      }
    }

    row.push(current.trim());
    result.push(row);
  }

  return result;
}

function getTodayString() {
  const now = new Date();
  const d = String(now.getDate()).padStart(2, '0');
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const y = now.getFullYear();
  return `${y}-${m}-${d}`;
}

function matchDate(rowDate, filterDate) {
  if (!filterDate) return true;
  if (!rowDate) return false;

  try {
    const fp = filterDate.split('-');
    const fy = parseInt(fp[0]);
    const fm = parseInt(fp[1]);
    const fd = parseInt(fp[2]);

    const parts = rowDate.split('/');
    if (parts.length === 3) {
      const rd = parseInt(parts[0]);
      const rm = parseInt(parts[1]);
      let ry = parseInt(parts[2]);
      if (ry > 2500) ry = ry - 543;
      return rd === fd && rm === fm && ry === fy;
    }
  } catch (e) {}

  return false;
}

function getTempColor(temp, result) {
  const t = parseFloat(temp);
  if (isNaN(t)) return 'pass';
  if (result && result.includes('ไม่ผ่าน')) return 'fail';
  if (result && result.includes('แจ้งเตือน')) return 'warn';
  if (t > 5) return 'fail';
  if (t > 4) return 'warn';
  return 'pass';
}

function buildCard(row) {
  const plate = row[COL.plate] || '-';
  const company = row[COL.company] || '-';
  const temp = row[COL.temp] || '-';
  const product = row[COL.product] || '-';
  const status = getTempColor(temp, row[COL.tempResult]);
  const tempNum = parseFloat(temp);

  const badgeText =
    status === 'fail'
      ? '❌ ไม่ผ่าน'
      : status === 'warn'
      ? '⚠️ แจ้งเตือน'
      : '✅ ผ่าน';

  return `
    <div class="card card-${status}">
      <div class="card-top">
        <div class="plate">${plate}</div>
        <div class="badge badge-${status}">${badgeText}</div>
      </div>
      <div class="temp-display temp-${status}">
        ${isNaN(tempNum) ? '-' : tempNum.toFixed(1)}°C
      </div>
      <div class="card-meta">
        🏢 ${company}<br>
        📦 ${product}
      </div>
    </div>
  `;
}

function getCompanyStats(data) {
  const stats = {};
  
  data.forEach(row => {
    const company = row[COL.company] || 'ไม่ระบุ';
    if (!stats[company]) {
      stats[company] = { total: 0, pass: 0, fail: 0, warn: 0, temps: [] };
    }

    const status = getTempColor(row[COL.temp], row[COL.tempResult]);
    const temp = parseFloat(row[COL.temp]);

    stats[company].total++;
    stats[company][status]++;
    if (!isNaN(temp)) stats[company].temps.push(temp);
  });

  return stats;
}

function calculateCompanyScore(stats) {
  const scores = {};
  
  Object.entries(stats).forEach(([company, data]) => {
    const passRate = (data.pass / data.total) * 100;
    const avgTemp = data.temps.length ? (data.temps.reduce((a, b) => a + b) / data.temps.length) : 0;
    const tempScore = Math.max(0, 100 - (avgTemp * 10));
    
    scores[company] = {
      passRate,
      tempScore,
      total: (passRate * 0.6 + tempScore * 0.4),
      stats: data
    };
  });

  return scores;
}

function renderCompanyPerformance() {
  const stats = getCompanyStats(allData);
  const scores = calculateCompanyScore(stats);

  let html = `<div class="summary-box">
    <div class="summary-title">📊 ประสิทธิภาพแต่ละบริษัท</div>`;

  Object.entries(scores)
    .sort((a, b) => b[1].total - a[1].total)
    .forEach(([company, data]) => {
      const passRate = data.passRate.toFixed(1);
      const failRate = (100 - data.passRate).toFixed(1);

      html += `
        <div class="sum-row">
          <div class="sum-label">${company}</div>
          <div class="sum-bar-track">
            <div style="display:flex;height:100%">
              <div style="width:${passRate}%;background:#4CAF50"></div>
              <div style="width:${failRate}%;background:#EF5350"></div>
            </div>
          </div>
          <div style="width:100px;text-align:right;font-weight:700;font-family:'Times New Roman',serif">
            ${passRate}% ผ่าน
          </div>
        </div>
      `;
    });

  html += '</div>';
  document.getElementById('company-content').innerHTML = html;
}

function renderRanking() {
  const stats = getCompanyStats(allData);
  const scores = calculateCompanyScore(stats);

  const sorted = Object.entries(scores)
    .sort((a, b) => b[1].total - a[1].total);

  const medals = ['🥇', '🥈', '🥉'];
  let html = `<div class="company-ranking">
    <div class="summary-title">🏆 อันดับบริษัท</div>`;

  sorted.forEach(([company, data], index) => {
    const medal = medals[index] || '📌';
    const stars = Math.round(data.total / 20);
    const starDisplay = '⭐'.repeat(Math.min(stars, 5));

    html += `
      <div class="ranking-item">
        <div class="ranking-medal">${medal}</div>
        <div class="ranking-info">
          <div class="ranking-name">${company}</div>
          <div class="ranking-stats">
            <span>รถทั้งหมด: ${data.stats.total}</span>
            <span>ผ่าน: ${data.stats.pass}</span>
            <span>ไม่ผ่าน: ${data.stats.fail}</span>
          </div>
        </div>
        <div class="ranking-score">${data.total.toFixed(1)}</div>
        <div class="stars">${starDisplay}</div>
      </div>
    `;
  });

  html += '</div>';
  document.getElementById('ranking-content').innerHTML = html;
}

function renderTrendAnalysis() {
  const range = parseInt(document.getElementById('trend-range').value) || 7;
  const company = document.getElementById('trend-company').value;

  const now = new Date();
  const startDate = new Date(now.getTime() - range * 24 * 60 * 60 * 1000);

  const trendData = {};
  
  allData.forEach(row => {
    if (company && row[COL.company] !== company) return;

    const dateStr = row[COL.date];
    if (!dateStr) return;

    const parts = dateStr.split('/');
    if (parts.length !== 3) return;

    let d = parseInt(parts[0]);
    let m = parseInt(parts[1]);
    let y = parseInt(parts[2]);
    if (y > 2500) y = y - 543;

    const rowDate = new Date(y, m - 1, d);
    if (rowDate < startDate) return;

    const key = rowDate.toISOString().split('T')[0];
    if (!trendData[key]) {
      trendData[key] = { pass: 0, fail: 0, warn: 0, total: 0, temps: [] };
    }

    const status = getTempColor(row[COL.temp], row[COL.tempResult]);
    const temp = parseFloat(row[COL.temp]);

    trendData[key].total++;
    trendData[key][status]++;
    if (!isNaN(temp)) trendData[key].temps.push(temp);
  });

  const dates = Object.keys(trendData).sort();
  const passRates = dates.map(d => (trendData[d].pass / trendData[d].total * 100).toFixed(1));
  const avgTemps = dates.map(d => trendData[d].temps.length ? (trendData[d].temps.reduce((a, b) => a + b) / trendData[d].temps.length).toFixed(1) : 0);

  let html = `<div class="trend-chart">
    <div class="chart-title">📈 แนวโน้มการปรับปรุง</div>
    <canvas id="trendChart"></canvas>
  </div>`;

  document.getElementById('trend-content').innerHTML = html;

  setTimeout(() => {
    const ctx = document.getElementById('trendChart');
    if (!ctx) return;

    if (trendChart) trendChart.destroy();

    trendChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: dates,
        datasets: [{
          label: 'อัตราการผ่าน (%)',
          data: passRates,
          borderColor: '#4CAF50',
          backgroundColor: 'rgba(76, 175, 80, 0.1)',
          tension: 0.4,
          fill: true
        }, {
          label: 'อุณหภูมิเฉลี่ย (°C)',
          data: avgTemps,
          borderColor: '#FF9800',
          backgroundColor: 'rgba(255, 152, 0, 0.1)',
          tension: 0.4,
          fill: true,
          yAxisID: 'y1'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: { display: true, text: 'อัตราการผ่าน (%)' }
          },
          y1: {
            type: 'linear',
            position: 'right',
            beginAtZero: true,
            max: 10,
            title: { display: true, text: 'อุณหภูมิ (°C)' }
          }
        }
      }
    });
  }, 100);
}

function renderAdvancedSearch() {
  const plateTerm = document.getElementById('search-plate').value.toLowerCase();
  const companyTerm = document.getElementById('search-company').value.toLowerCase();
  const productTerm = document.getElementById('search-product').value.toLowerCase();
  const statusTerm = document.getElementById('search-status').value;

  let filtered = allData.filter(row => {
    if (plateTerm && !row[COL.plate]?.toLowerCase().includes(plateTerm)) return false;
    if (companyTerm && !row[COL.company]?.toLowerCase().includes(companyTerm)) return false;
    if (productTerm && !row[COL.product]?.toLowerCase().includes(productTerm)) return false;

    const status = getTempColor(row[COL.temp], row[COL.tempResult]);
    if (statusTerm && status !== statusTerm) return false;

    return true;
  });

  let html = `<div class="section-title">🔍 ผลการค้นหา (${filtered.length} รายการ)</div>`;

  if (filtered.length === 0) {
    html += '<div class="empty-state">ไม่พบข้อมูลที่ตรงกับการค้นหา</div>';
  } else {
    html += '<div class="cards-grid">';
    filtered.forEach(row => html += buildCard(row));
    html += '</div>';
  }

  document.getElementById('search-content').innerHTML = html;
}

function renderDailyReport() {
  const filterDate = document.getElementById('filter-date').value;
  const filterCompany = document.getElementById('filter-company').value;
  const filterProduct = document.getElementById('filter-product').value;
  const filterStatus = document.getElementById('filter-status').value;
  const filterTempMin = parseFloat(document.getElementById('filter-temp-min').value) || -Infinity;
  const filterTempMax = parseFloat(document.getElementById('filter-temp-max').value) || Infinity;

  let filtered = allData.filter(row => {
    if (!row[COL.plate]) return false;
    if (filterDate && !matchDate(row[COL.date], filterDate)) return false;
    if (filterCompany && row[COL.company] !== filterCompany) return false;
    if (filterProduct && !(row[COL.product] || '').includes(filterProduct)) return false;

    const temp = parseFloat(row[COL.temp]);
    if (!isNaN(temp) && (temp < filterTempMin || temp > filterTempMax)) return false;

    const status = getTempColor(row[COL.temp], row[COL.tempResult]);
    if (filterStatus && status !== filterStatus) return false;

    return true;
  });

  const problems = filtered.filter(r => {
    const s = getTempColor(r[COL.temp], r[COL.tempResult]);
    return s === 'fail' || s === 'warn';
  });

  const passed = filtered.filter(r =>
    getTempColor(r[COL.temp], r[COL.tempResult]) === 'pass'
  );

  const totalCount = filtered.length;
  const passCount = passed.length;
  const failCount = problems.length;

  const temps = filtered
    .map(r => parseFloat(r[COL.temp]))
    .filter(t => !isNaN(t));

  const avgTemp = temps.length ? (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1) : '-';
  const maxTemp = temps.length ? Math.max(...temps).toFixed(1) : '-';
  const minTemp = temps.length ? Math.min(...temps).toFixed(1) : '-';

  document.getElementById('display-date').textContent = `📅 ${filterDate || 'ทุกวัน'}`;
  document.getElementById('last-update').textContent = `อัปเดต: ${new Date().toLocaleTimeString('th-TH')}`;

  let html = `
    <div class="kpi-row">
      <div class="kpi kpi-total">
        <div class="kpi-label">รถที่ตรวจ</div>
        <div class="kpi-value">${totalCount}</div>
      </div>

      <div class="kpi kpi-pass">
        <div class="kpi-label">ผ่าน</div>
        <div class="kpi-value">${passCount}</div>
        <div class="kpi-sub">${totalCount > 0 ? ((passCount/totalCount)*100).toFixed(1) : 0}%</div>
      </div>

      <div class="kpi kpi-fail">
        <div class="kpi-label">ไม่ผ่าน / แจ้งเตือน</div>
        <div class="kpi-value">${failCount}</div>
        <div class="kpi-sub">${totalCount > 0 ? ((failCount/totalCount)*100).toFixed(1) : 0}%</div>
      </div>

      <div class="kpi kpi-avg">
        <div class="kpi-label">เฉลี่ยอุณหภูมิ</div>
        <div class="kpi-value">${avgTemp}</div>
        <div class="kpi-sub">°C</div>
      </div>

      <div class="kpi kpi-max">
        <div class="kpi-label">อุณหภูมิสูงสุด</div>
        <div class="kpi-value">${maxTemp}</div>
        <div class="kpi-sub">°C</div>
      </div>

      <div class="kpi kpi-min">
        <div class="kpi-label">อุณหภูมิต่ำสุด</div>
        <div class="kpi-value">${minTemp}</div>
        <div class="kpi-sub">°C</div>
      </div>
    </div>
  `;

  const worstTruck = filtered
    .filter(r => getTempColor(r[COL.temp], r[COL.tempResult]) === 'fail')
    .sort((a, b) => parseFloat(b[COL.temp]) - parseFloat(a[COL.temp]))[0];

  if (worstTruck) {
    html += `
      <div style="
        background:linear-gradient(135deg,#C62828,#EF5350);
        border-radius:18px;
        padding:24px;
        margin-bottom:20px;
        color:#fff;
      ">
        <div style="font-size:18px;margin-bottom:10px;">
          🔴 รถไม่ผ่านหนักสุดวันนี้
        </div>
        <div style="font-size:44px;font-weight:800;font-family:'Times New Roman',serif;">
          ${worstTruck[COL.plate]}
        </div>
        <div style="font-size:74px;font-weight:900;line-height:1;font-family:'Times New Roman',serif;">
          ${parseFloat(worstTruck[COL.temp]).toFixed(1)}°C
        </div>
      </div>
    `;
  }

  html += `
    <div class="section-title">
      ⚠️ รถที่มีปัญหา (${problems.length} คัน)
    </div>
  `;

  if (problems.length === 0) {
    html += '<div class="empty-state">✅ ไม่มีรถที่มีปัญหาวันนี้</div>';
  } else {
    html += '<div class="cards-grid">';
    problems.forEach(row => html += buildCard(row));
    html += '</div>';
  }

  document.getElementById('daily-content').innerHTML = html;
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const rows = parseCSV(text);

    headers = rows[0];
    detectColumns(headers);
    allData = rows.slice(1);

    const companies = [...new Set(allData.map(r => r[COL.company]).filter(Boolean))].sort();
    
    [
      { id: 'filter-company', selector: '#filter-company' },
      { id: 'trend-company', selector: '#trend-company' }
    ].forEach(({ selector }) => {
      const select = document.querySelector(selector);
      companies.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    });

    const products = [...new Set(
      allData.flatMap(r => (r[COL.product] || '').split(',').map(p => p.trim())).filter(Boolean)
    )].sort();

    const productSelect = document.getElementById('filter-product');
    products.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      productSelect.appendChild(opt);
    });

    renderDailyReport();
    renderCompanyPerformance();
    renderRanking();

  } catch (e) {
    document.getElementById('daily-content').innerHTML = '<div class="empty-state">❌ โหลดข้อมูลไม่ได้</div>';
  }
}

document.getElementById('btn-export-csv').addEventListener('click', () => {
  let csv = 'ทะเบียนรถ,บริษัท,สินค้า,อุณหภูมิ,สถานะ,วันที่\n';
  
  allData.forEach(row => {
    const plate = row[COL.plate] || '';
    const company = row[COL.company] || '';
    const product = row[COL.product] || '';
    const temp = row[COL.temp] || '';
    const status = getTempColor(temp, row[COL.tempResult]);

    csv += `"${plate}","${company}","${product}","${temp}","${status}","${date}"\n`;

    trendChart.update();
  }
}
